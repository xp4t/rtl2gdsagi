suite: claude_sonnet5_rtl2gds
model: claude-sonnet-5
cases:
  - id: 01_alu_lint
    scale: small
    structure: single_module_combinational
    injected_stage: lint
    injected_fault: missing_semicolon
    expected_repair: PATCH_WORKING_RTL
  - id: 02_counter_lint
    scale: small
    structure: single_module_sequential
    injected_stage: lint
    injected_fault: undeclared_next_state_wire
    expected_repair: PATCH_WORKING_RTL
  - id: 03_hier_adder_lint
    scale: small
    structure: multi_module_combinational
    injected_stage: lint
    injected_fault: wrong_named_instance_port
    expected_repair: PATCH_WORKING_RTL
  - id: 04_fifo_lint
    scale: medium
    structure: inferred_memory_sequential
    injected_stage: lint
    injected_fault: two_undeclared_pointer_wires
    expected_repair: PATCH_WORKING_RTL
  - id: 05_arbiter_lint
    scale: medium
    structure: sequential_control
    injected_stage: lint
    injected_fault: procedural_assignment_to_wire
    expected_repair: PATCH_WORKING_RTL
  - id: 06_pdn_geometry
    scale: small
    structure: sequential
    injected_stage: pdn
    injected_fault: straps_ring_and_offset_do_not_fit
    expected_repair: SET_IR_VALUE_curated_or_model
  - id: 07_cts_bad_buffer
    scale: medium
    structure: sequential
    injected_stage: cts
    injected_fault: nonexistent_root_buffer_cell
    expected_repair: SET_IR_VALUE
  - id: 08_routing_congestion
    scale: medium
    structure: generated_crossbar_combinational
    injected_stage: placement_or_routing
    injected_fault: dense_one_layer_low_effort_route
    expected_repair: SET_IR_VALUE
  - id: 09_drc_no_filler
    scale: medium
    structure: sequential
    injected_stage: drc
    injected_fault: filler_cells_disabled
    expected_repair: SET_IR_VALUE
  - id: 10_large_cpu_timing
    scale: large
    structure: three_module_cpu_datapath_with_regfile_and_multiplier
    injected_stage: sta_postcts_or_sta_signoff
    injected_fault: aggressive_clock_and_area_first_mapping
    expected_repair: SET_IR_VALUE_without_relaxing_clock

