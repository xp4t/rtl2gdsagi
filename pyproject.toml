[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rtl2gdsagi"
version = "0.1.0"
description = "Agentic RTL-to-GDS orchestrator — OpenLane2 + Claude API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["asic", "eda", "rtl-to-gds", "openlane", "claude", "llm", "ai", "physical-design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "anthropic>=0.34.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "openlane>=2.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
rtl2gds = "run_flow:main"

[project.urls]
Homepage = "https://github.com/your-org/rtl2gdsagi"
Issues   = "https://github.com/your-org/rtl2gdsagi/issues"

[tool.setuptools.packages.find]
include = ["orchestrator*", "parsers*", "agent*", "config*", "sweep*"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
