# Simple 8-bit ALU — test design for file-type tracking.
#
#   .venv/bin/rtl2gdsagi run --config examples/alu8/alu8.yaml --no-api
#
top: alu8
rtl: examples/alu8/rtl

pdk:
  name: sky130A

retry_limit: 3

ir:
  sim:
    testbench_dir: examples/alu8/tb
  pdn:
    strap_offset_um: 1.0
    strap_pitch_um: 10.0
    core_ring: false
  floorplan:
    core_utilization: 0.30
