# 4-to-1 multiplexer with registered output — test design for file-type tracking.
#
#   .venv/bin/rtl2gdsagi run --config examples/mux4to1/mux4to1.yaml --no-api
#
top: mux4to1
rtl: examples/mux4to1/rtl

pdk:
  name: sky130A

retry_limit: 3

ir:
  sim:
    testbench_dir: examples/mux4to1/tb
  pdn:
    strap_offset_um: 1.0
    strap_pitch_um: 10.0
    core_ring: false
  floorplan:
    core_utilization: 0.30
