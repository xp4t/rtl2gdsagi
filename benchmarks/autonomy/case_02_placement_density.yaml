id: case_02_placement_density
title: Over-aggressive placement density
kind: same_stage

design: examples/register/register.yaml

inject:
  ir:
    placement:
      target_density: 0.98

ground_truth:
  injected_defect: >
    Global placement is asked to pack cells to 98% density, well above what the
    placer can legalise comfortably for this floorplan.
  expected_failure_stage: [placement, routing]
  true_root_cause: placement
  responsible_stage: placement
  forbidden: [rtl, sdc, pdk]
  success_criteria:
    - the diagnosis implicates placement
    - target_density is reduced
    - placement converges and routing completes
  expected_outcome: closed_or_improved
