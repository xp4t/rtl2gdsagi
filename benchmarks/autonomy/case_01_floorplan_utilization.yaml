id: case_01_floorplan_utilization
title: Excessive floorplan utilization surfaces as a placement/routing problem
kind: cross_stage

design: examples/register/register.yaml

# The injected defect. Schema-valid, simply a bad choice.
inject:
  ir:
    floorplan:
      core_utilization: 0.92

ground_truth:
  injected_defect: >
    The core is sized for 92% utilization. The cells fit, so the floorplan
    stage itself succeeds; the consequence appears later as a placement that
    cannot spread out and a route that has nowhere to go.
  expected_failure_stage: [placement, routing]
  true_root_cause: floorplan
  # A fix confined to the failing stage cannot work: no routing knob creates
  # area that the floorplan did not allocate.
  responsible_stage: floorplan
  forbidden:
    - rtl
    - sdc
    - pdk
    - drc/lvs/antenna decks
  success_criteria:
    - the diagnosis implicates floorplan (not only the stage that failed)
    - rollback re-runs floorplan and everything downstream
    - core_utilization is reduced
    - the re-run reaches a verdict at least as good as the failing one
  expected_outcome: closed_or_improved

notes: >
  This is the case that distinguishes backward causal reasoning from local
  retry. Report it separately from same-stage successes.
