# Design-specific config for the RISC-V ALU demo design.
# Inherits param structure from config/defaults.yaml.

design:
  top_module: riscv_alu
  rtl_files:
    - designs/riscv_alu/rtl/alu.v
  clock_port: clk
  pdk: sky130hd
  description: "RV32I ALU slice — demo design for rtl2gdsagy proof-of-concept"

# Override global defaults for this design
defaults:
  PDK: sky130hd
  STD_CELL_LIBRARY: sky130_fd_sc_hd
  DESIGN_NAME: riscv_alu
  CLOCK_PORT: clk
  CLOCK_PERIOD: 10.0          # ns (100 MHz) — very achievable for this design
  FP_CORE_UTIL: 45
  FP_ASPECT_RATIO: 1.0
  PL_TARGET_DENSITY: 0.55
  SYNTH_STRATEGY: 2
  SYNTH_MAX_FANOUT: 10
  ROUTING_CORES: 4
  CTS_TARGET_SKEW: 200
  DIODE_INSERTION_STRATEGY: 4
  VERBOSE: 0

# Narrowed param ranges for this design
param_ranges:
  CLOCK_PERIOD:
    type: float
    min: 5.0      # 200 MHz max — ALU is combinational-heavy, very fast
    max: 50.0
    default: 10.0
  FP_CORE_UTIL:
    type: int
    min: 30
    max: 70
    default: 45
  FP_ASPECT_RATIO:
    type: float
    min: 0.5
    max: 2.0
    default: 1.0
  PL_TARGET_DENSITY:
    type: float
    min: 0.35
    max: 0.80
    default: 0.55
  SYNTH_STRATEGY:
    type: int
    min: 0
    max: 4
    default: 2
  SYNTH_MAX_FANOUT:
    type: int
    min: 4
    max: 24
    default: 10
  CTS_TARGET_SKEW:
    type: int
    min: 100
    max: 400
    default: 200
  ROUTING_CORES:
    type: int
    min: 1
    max: 16
    default: 4
  GLB_RT_OVERFLOW_ITERS:
    type: int
    min: 50
    max: 200
    default: 100
  DIODE_INSERTION_STRATEGY:
    type: int
    min: 0
    max: 5
    default: 4
  SYNTH_BUFFERING:
    type: bool
    default: true
  SYNTH_SIZING:
    type: bool
    default: false
  PL_ROUTABILITY_DRIVEN:
    type: bool
    default: true
  PL_TIME_DRIVEN:
    type: bool
    default: true

sweeps:
  synthesis:
    - {SYNTH_STRATEGY: 0, SYNTH_MAX_FANOUT: 8}    # area-focused
    - {SYNTH_STRATEGY: 1, SYNTH_MAX_FANOUT: 12}   # delay-focused
    - {SYNTH_STRATEGY: 2, SYNTH_MAX_FANOUT: 10}   # balanced (default)

  placement:
    - {PL_TARGET_DENSITY: 0.45, PL_TIME_DRIVEN: true}
    - {PL_TARGET_DENSITY: 0.55, PL_ROUTABILITY_DRIVEN: true}
    - {PL_TARGET_DENSITY: 0.65}

flow:
  max_iterations: 3
  sweep_parallelism: 2
